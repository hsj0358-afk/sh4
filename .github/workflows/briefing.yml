name: 아침 신문 브리핑

# 방식 B(유료 API) 자동 실행. PC 없이 GitHub 서버에서 매일 돕니다.
# ※ 무료 경로(Claude Code Routine)를 쓰신다면 이 워크플로는 필요 없습니다.
#    아래 Secrets 가 없으면 실패하지 않고 '건너뜀(green)' 처리됩니다.
#    Actions 자동 실행을 완전히 끄려면 아래 schedule 블록을 삭제하세요.
on:
  schedule:
    # cron 은 UTC 기준. '0 22 * * *' = 한국시간(KST) 오전 7:00.
    # 시간을 바꾸려면: 원하는 KST 시 - 9 = UTC 시 (예: 8시 → 23, 6시 → 21)
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼 (Actions 탭에서 즉시 실행/테스트)

# 워크플로 동시 실행 방지
concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul          # 날짜/시간을 한국 기준으로
      # 필수 Secrets 가 모두 있을 때만 실제 실행. (없으면 실패 대신 건너뜀)
      HAS_SECRETS: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.GMAIL_USER != '' && secrets.GMAIL_APP_PASSWORD != '' && secrets.BRIEFING_TO != '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
      BRIEFING_FROM_NAME: ${{ secrets.BRIEFING_FROM_NAME }}
    steps:
      - name: Secrets 확인
        run: |
          if [ "${HAS_SECRETS}" != "true" ]; then
            echo "::warning::필수 Secrets(ANTHROPIC_API_KEY/GMAIL_USER/GMAIL_APP_PASSWORD/BRIEFING_TO) 미등록 → 브리핑 스텝을 건너뜁니다. 무료 Routine 경로를 쓰거나 Secrets 를 등록하세요."
          else
            echo "Secrets OK — 브리핑을 실행합니다."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        if: env.HAS_SECRETS == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 브리핑 생성 및 메일 발송
        if: env.HAS_SECRETS == 'true'
        run: python -m briefing

      - name: 리포트 아티팩트 업로드
        if: env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: briefing-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

name: 아침 신문 브리핑

# PC를 켜지 않아도 GitHub 서버에서 매일 자동 실행됩니다.
on:
  schedule:
    # cron 은 UTC 기준. '0 22 * * *' = 한국시간(KST) 오전 7:00.
    # 시간을 바꾸려면: 원하는 KST 시 - 9 = UTC 시 (예: 8시 → 23, 6시 → 21)
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼 (Actions 탭에서 즉시 실행/테스트)

# 워크플로 동시 실행 방지
concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul          # 날짜/시간을 한국 기준으로
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
      BRIEFING_FROM_NAME: ${{ secrets.BRIEFING_FROM_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 브리핑 생성 및 메일 발송
        run: python -m briefing

      - name: 리포트 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

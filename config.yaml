# =========================================================================
# 신문 브리핑 자동화 설정
# - 비밀값(API 키, Gmail 비밀번호 등)은 여기에 넣지 말고 .env 에 두세요.
# - 키워드/언론사/카테고리는 자유롭게 수정하세요.
# =========================================================================

# 부서장이 매일 읽는 6개 종이신문 (네이버 언론사 코드 oid)
presses:
  "023": 조선일보
  "025": 중앙일보
  "020": 동아일보
  "009": 매일경제
  "015": 한국경제
  "030": 전자신문

# 본문을 Claude 에 보낼 때 기사당 최대 글자수 (토큰/비용 조절)
body_char_limit: 2500

# 제목 선별 단계에서 Claude 에 보낼 최대 기사 수 (안전장치)
max_titles_for_select: 800

# -------------------------------------------------------------------------
# 키워드 프리필터: 아래 키워드가 제목/본문에 있으면 분석 후보로 무조건 포함.
# (Claude 가 의미 기반으로 추가 선별도 하지만, 핵심 키워드는 놓치지 않도록 보강)
# -------------------------------------------------------------------------

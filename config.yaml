    - KT
    - 케이티
    - kt
    - KT클라우드
    - kt클라우드
    - BC카드
    - 비씨카드
    - 케이뱅크
    - 스카이라이프
    - KT스카이라이프
    - KT엠모바일
    - 지니뮤직
    - 나스미디어
    - KT DS
    - KT에스테이트
    - 현대HCN
    - 박윤영        # KT 대표이사 (인물 언급 모니터링)
  # KT 직접 경쟁사(통신 라이벌) — 하드 포함. 이들은 HR뿐 아니라 AI/AX·사업 동향도 본다.

# 오탐 차단: 아래 단어는 키워드 매칭 전에 제거합니다.
# 예) 'KT'가 'KT&G'(담배)·'KTX'(철도)에 부분일치되어 잘못 잡히는 것을 방지.
excludes:
  - KT&G
  - 케이티앤지
  - KTX
  - KT-1        # 국산 훈련기 (KT그룹 무관)
  - KTL         # 한국산업기술시험원

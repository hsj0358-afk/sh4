# =========================================================================
# 축구토토 승무패 분석기 설정
#   - 비밀값은 여기 두지 말 것 (.env 사용)
#   - 승무패에 새 리그가 나오면 leagues 에 항목만 추가하면 된다
# =========================================================================

# 베트맨 -------------------------------------------------------------------
betman:
  # 축구토토 승무패 게임 ID (게임슬립 URL 의 gmId 파라미터)
  game_id: "G011"
  # 게임슬립 URL 템플릿. {round} 자리에 회차 코드(gmTs)가 들어간다.
  # 예: .../gameSlip.do?frameType=typeA&gmId=G011&gmTs=260043
  slip_url: "https://www.betman.co.kr/main/mainPage/gamebuy/gameSlip.do?frameType=typeA&gmId={game_id}&gmTs={round}"
  # 회차 목록/판매중 회차 확인용 페이지
  buy_url: "https://www.betman.co.kr/main/mainPage/gamebuy/gameBuyList.do"
  expected_matches: 14

# 피나클 -------------------------------------------------------------------
pinnacle:
  # SPA 페이지가 읽는 공개 guest API (웹앱에 내장된 공개 키)
  api_base: "https://guest.api.arcadia.pinnacle.com/0.1"
  api_key: "CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R"
  soccer_sport_id: 29
  timeout_sec: 20
  # guest API 가 막히면 아래 리그별 웹 페이지를 Playwright 로 열어 XHR 을 가로챈다
  fallback_to_browser: true

# 후스코어드 ---------------------------------------------------------------
whoscored:
  base: "https://www.whoscored.com"
  # 봇 차단(Incapsula) 통과율을 높이는 옵션
  headless: true
  # 요청 간 대기(초). 너무 짧으면 차단당한다.
  delay_sec: 4.0
  timeout_ms: 45000
  # 브라우저 프로필을 유지해 통과 쿠키를 재사용 (권장)
  persistent_profile: true
  recent_form_count: 6      # 제안서의 '최근 6경기 기세'
  h2h_count: 10

# FotMob -------------------------------------------------------------------
# 순위표(홈/원정 분리) · 최근 폼 · 시즌 내 맞대결을 리그당 요청 1회로 가져온다.
# requests 로는 404 라서 실제 브라우저가 필요하다(점검 도구로 확인).
fotmob:
  base: "https://www.fotmob.com"
  headless: true
  delay_sec: 1.5
  timeout_ms: 45000
  persistent_profile: true
  # 시즌 팀 통계 피드. 리그 응답의 stats.teams[] 가 알려주는 29종 중
  # 레이더·비교표에 실제로 쓰는 것만 고른다. 지표 1개당 요청 1회지만
  # 한 번에 그 리그 전 팀 값이 오므로 팀별 페이지보다 훨씬 싸다.
  #   feed  : stats.teams[].name (FotMob 이 준 URL 조각)
  #   field : TeamStats 속성명
  # 비우면 소스의 기본 목록을 쓴다. 항목을 줄이면 그만큼 빨라진다.
  team_stats:
    - {feed: "possession_percentage_team", field: "possession"}
    - {feed: "ontarget_scoring_att_team",  field: "shots_on_target_pg"}
    - {feed: "big_chance_team",            field: "big_chances_pg"}
    - {feed: "big_chance_missed_team",     field: "big_chances_missed_pg"}
    - {feed: "touches_in_opp_box_team",    field: "touches_opp_box_pg"}
    - {feed: "accurate_pass_team",         field: "accurate_passes_pg"}
    - {feed: "poss_won_att_3rd_team",      field: "poss_won_att_3rd_pg"}
    - {feed: "saves_team",                 field: "saves_pg"}
    - {feed: "interception_team",          field: "interceptions_pg"}
    - {feed: "total_tackle_team",          field: "tackles_pg"}
    - {feed: "effective_clearance_team",   field: "clearances_pg"}
    - {feed: "corner_taken_team",          field: "corners_pg"}
    - {feed: "clean_sheet_team",           field: "clean_sheets"}
    - {feed: "fk_foul_lost_team",          field: "fouls_pg"}
    - {feed: "rating_team",                field: "rating"}

# 리그 정의 ----------------------------------------------------------------
# key: 내부 식별자
#   ko           : 리포트 표시명
#   aliases      : 베트맨 리그 표기 변형 (부분일치로 매칭)
#   pinnacle_url : 사용자가 지정한 매치업 페이지 (브라우저 폴백 시 사용)
#   pinnacle_name: guest API 의 리그명 — **완전일치**로만 비교한다.
#                  부분일치를 쓰면 "England - Premier League" 가
#                  "England - Premier League 2 U21" 에 걸린다(실측).
#   pinnacle_aliases: 이름이 바뀌었을 때 쓰는 추가 후보 (선택, 완전일치)
#   country      : 국가명. FotMob 에 동명 리그가 16개까지 있어
#                  후보를 좁히는 데 쓴다(실측).
#   fotmob_name  : FotMob 리그명. 같은 이름이 여러 나라에 있으므로
#                  후보가 여럿이면 순위표의 팀 구성으로 가린다.
#   fotmob_id    : 확인된 ID 가 있으면 여기에. 탐색보다 우선한다.

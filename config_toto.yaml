# 레이더 차트 항목 ---------------------------------------------------------
# key      : TeamStats 의 속성명
# label    : 표시명
# invert   : true 면 값이 낮을수록 좋음 (실점 등) → 백분위를 뒤집는다
radar_metrics:
  # 제안서의 6개 개념을 '지금 실제로 채울 수 있는' 지표로 옮긴 것.
  # 총 슈팅·키패스·피슈팅은 FotMob 시즌 통계 29종에 없어서 대체했다.
  #   공격 창출력  → 결정적 기회 + 유효슈팅
  #   공격 효율성  → 경기당 득점 (유효슈팅 대비 전환은 비교표에서 본다)
  #   수비 견고함  → 피xG (피슈팅의 상위 호환. 맞은 슈팅의 질까지 반영한다)
  #   경기 지배력  → 점유율 + 상대 박스 터치
  #   장소 특화도  → 홈/원정 경기당 승점
  # 값이 없는 축은 자동으로 빠지므로, 수집이 덜 돼도 차트는 그려진다.
  - {key: "big_chances_pg",     label: "결정적 기회",    invert: false}
  - {key: "shots_on_target_pg", label: "유효슈팅",       invert: false}
  - {key: "goals_for_pg",       label: "경기당 득점",    invert: false}
  - {key: "xga_pg",             label: "피xG",           invert: true}
  - {key: "possession",         label: "점유율",         invert: false}
  - {key: "touches_opp_box_pg", label: "상대 박스 터치", invert: false}
  - {key: "home_points_pg",     label: "홈 승점",        invert: false}
  - {key: "away_points_pg",     label: "원정 승점",      invert: false}

# 직접 비교(다이버징 바) 항목 ---------------------------------------------
compare_metrics:
  - {key: "points_pg",          label: "경기당 승점",    fmt: "{:.2f}"}
  - {key: "goals_for_pg",       label: "경기당 득점",    fmt: "{:.2f}"}
  - {key: "goals_against_pg",   label: "경기당 실점",    fmt: "{:.2f}"}
  - {key: "xg_pg",              label: "경기당 xG",      fmt: "{:.2f}"}
  - {key: "xga_pg",             label: "경기당 피xG",    fmt: "{:.2f}"}
  - {key: "finishing_delta",    label: "결정력(득점−xG)", fmt: "{:+.1f}"}
  - {key: "possession",         label: "점유율(%)",      fmt: "{:.1f}"}
  - {key: "shots_on_target_pg", label: "유효슈팅",       fmt: "{:.1f}"}
  - {key: "big_chances_pg",     label: "결정적 기회",    fmt: "{:.1f}"}
  - {key: "rating",             label: "평점",           fmt: "{:.2f}"}
  # 시즌 통계 피드에서 오는 항목. 누계로 오므로 경기당으로 나눠 비교한다
  # (팀마다 소화 경기수가 다르면 누계는 그대로 비교할 수 없다).
  - {key: "set_piece_goals_pg", label: "세트피스 득점",  fmt: "{:.2f}"}
  - {key: "set_piece_goals_conceded_pg", label: "세트피스 실점", fmt: "{:.2f}"}
  - {key: "yellow_cards_pg",    label: "경고",           fmt: "{:.2f}"}
  - {key: "accurate_crosses_pg", label: "정확한 크로스",  fmt: "{:.1f}"}
  - {key: "accurate_long_balls_pg", label: "정확한 롱볼", fmt: "{:.1f}"}

# 최근 N경기 프로필(다이버징 바) 항목 ---------------------------------------
# 위 compare_metrics 와 **표본이 다르다.** 여기 값은 시즌 누계가 아니라
# `fotmob.match_detail_matches` 로 정한 최근 N경기의 경기당 평균이다.
# 섞이면 안 되므로 리포트에서도 블록을 따로 두고 표본 크기를 함께 적는다.
#
# 이 지표들은 FotMob 시즌 통계 29종에 **없다.** 경기 상세
# (api/data/matchDetails)에만 있어서 여기서만 나온다.
# `--skip-match-details` 로 돌리면 값이 없어 블록 전체가 빠진다.
recent_metrics:
  - {key: "npxg_recent_pg",     label: "npxG(PK 제외)",  fmt: "{:.2f}"}
  - {key: "npxga_recent_pg",    label: "피npxG",         fmt: "{:.2f}"}
  - {key: "xgot_recent_pg",     label: "xGOT",           fmt: "{:.2f}"}
  - {key: "xgot_against_recent_pg", label: "피xGOT",     fmt: "{:.2f}"}
  - {key: "xgot_delta_recent",  label: "xGOT−npxG(합계)", fmt: "{:+.2f}"}
  - {key: "xg_open_play_recent_pg", label: "오픈플레이 xG", fmt: "{:.2f}"}
  - {key: "xg_set_play_recent_pg",  label: "세트피스 xG",   fmt: "{:.2f}"}
  - {key: "shots_recent_pg",    label: "슈팅",           fmt: "{:.1f}"}
  - {key: "shots_against_recent_pg", label: "피슈팅",    fmt: "{:.1f}"}
  - {key: "shots_on_target_recent_pg", label: "유효슈팅", fmt: "{:.1f}"}
  - {key: "shots_on_target_against_recent_pg", label: "피유효슈팅", fmt: "{:.1f}"}
  - {key: "inside_box_shot_share", label: "박스 안 슈팅 비율(%)", fmt: "{:.0f}"}

# 시간축 분석 (Phase 2-A) ---------------------------------------------------
analysis:
  # 분석할 최근 N경기 창. 비워 두면 fotmob.shot_recent_windows 를 그대로 쓴다.
  # 여기 적은 창이 슛 계층에 없으면 그 창의 슛 지표는 비고, 득점·승점 같은
  # 결과 지표만 시즌 경기 색인에서 계산된다.
  periods: [10, 6, 5, 3]

  # 트렌드를 만들 최소 표본 (시즌·최근 양쪽 모두 이 수 이상이어야 한다).
  #
  # 이보다 적으면 값을 빼지 않고 "not_meaningful" 로 남긴다. 1~2경기의 차이를
  # 추세라고 적으면 안 된다.
  #
  # 표본 말고도 트렌드에는 조건이 더 있다 (toto/analysis.py trend_allowed):
  # 두 기간의 **측정 원천과 산출 방식이 같아야 하고**, 두 기간이 **같은 경기
  # 집합이면 안 된다.** 시즌 xG 는 경기 스탯 값이고 최근 xG 는 슛맵 합산이라
  # 같은 경기에서도 0.06 쯤 다르다 — 그 차이를 빼면 측정 방식의 차이가
  # 경기력 변화로 둔갑한다(실물 260048 풀럼에서 실제로 그랬다).
  trend_min_sample: 3

  # 트렌드 표시 문턱 ---------------------------------------------------------
  #
  #   ⚠ 운영용 기준이며 통계적으로 검증된 기준이 아님.
  #
  # "최근 값 − 시즌 값" 의 절댓값이 아래 숫자보다 작으면 화면에 "similar"
  # 로 적고, 크면 "higher"/"lower" 로 적는다. 그게 전부다.
  #
  #   · 이 문턱을 넘었다고 해서 전력이 올랐다는 뜻이 아니다.
  #   · 유의성 검정이 아니다. 표본 수(1~10경기)를 전혀 고려하지 않는다.
  #   · 밴드를 점수로 바꾸거나 여러 지표의 밴드를 합산하지 않는다.
  #
  # 단위는 그 지표의 단위 그대로다 (대부분 경기당 값, 승/무/패는 경기 수).
  trend_thresholds:
    default: 0.20
    goals: 0.30
    goals_against: 0.30
    goal_diff: 0.40
    xg: 0.25
    npxg: 0.25
    xgot: 0.25
    npxga: 0.25
    xgot_against: 0.25
    xgd: 0.35
    npxgd: 0.35
    shots: 2.0
    shots_against: 2.0
    shots_on_target: 1.0
    shots_on_target_against: 1.0
    shots_inside_box: 1.5
    points: 0.40
    big_chances: 0.8
    wins: 1.0
    draws: 1.0
    losses: 1.0

  # 기회의 질 / 공격 실행 (Phase 2-B) ---------------------------------------
  #
  #   슈팅 → xG·npxG → xGOT → 득점
  #
  # 아래 값은 그 흐름에서 **패턴을 화면에 적을지 말지**만 정한다. 지표 값
  # 자체는 이 설정과 무관하다.
  #
  #   ⚠ 운영용 기준이며 통계적으로 검증된 기준이 아님.
  #
  #   · 리그·시즌·전술에 따라 적정 수준이 다르다. 리그 평균에서 도출한
  #     값이 아니라 눈으로 정한 값이다.
  #   · 패턴은 상태 설명이지 추천이 아니다. "반등한다"·"결정력이 좋다"
  #     같은 예측으로 읽지 않는다.
  #   · 패턴을 세어 점수로 만들지 않는다.
  chance_quality:
    # 이 경기 수에 못 미치는 표본에서는 패턴을 아예 만들지 않는다.
    # 시즌 초 1~2경기로 "슈팅량 대비 기회 질이 낮다" 고 적으면 안 된다.
    min_sample: 3
    thresholds:
      shots_high: 14.0          # 경기당 슈팅이 이보다 많으면 '많다'
      shots_low: 10.0           # 이보다 적으면 '적다'
      xg_per_shot_high: 0.12    # 슛당 xG. 리그 평균은 대체로 0.10 안팎
      xg_per_shot_low: 0.09
      xg_high: 1.60             # 경기당 xG
      xgot_high: 1.40           # 경기당 xGOT
      goals_gap_low: -0.30      # 득점 − xG 가 이보다 낮으면 '득점이 적다'

  # 수비의 질 (Phase 2-C) ---------------------------------------------------
  #
  #   피슈팅 → npxGA → 피xGOT → 실점
  #
  # 위와 같은 성격의 표시용 문턱이다.
  #
  #   ⚠ 운영용 기준이며 통계적으로 검증된 기준이 아님.
  #
  #   · 패턴은 상태 설명이지 "좋은 수비" 점수가 아니다.
  #   · 실점 − npxGA 를 골키퍼 능력으로 읽지 않는다.
  #   · 패턴을 세어 점수로 만들거나 픽에 쓰지 않는다.
  defensive_quality:
    min_sample: 3
    thresholds:
      shots_against_high: 14.0    # 경기당 허용 슈팅이 이보다 많으면 '많다'
      shots_against_low: 9.0
      npxga_per_shot_high: 0.12   # 피슛당 npxGA
      npxga_per_shot_low: 0.08
      npxga_high: 1.50            # 경기당 npxGA
      npxga_low: 0.90
      xgot_against_high: 1.30     # 경기당 피xGOT
      goals_against_gap_high: 0.30  # 실점 − npxGA 가 이보다 크면 '실점이 많다'

  # 장소 문맥 (Phase 2-E) ---------------------------------------------------
  #
  #   이 경기와 같은 장소(홈팀은 홈, 원정팀은 원정)의 과거 표본을 전체와
  #   나란히 두고, 그 차이(장소차 = 장소 − 전체)를 적는다.
  #
  # 기간은 새로 만들지 않는다 — 2-A 의 최근 N경기를 먼저 잡고 그중 그 장소의
  # 경기만 고른다. 그래서 '최근 6경기 중 홈' 이 1경기일 수 있다.
  #
  #   ⚠ 운영용 기준이며 통계적으로 검증된 기준이 아님.
  #
  #   · 장소차는 방향을 정하지 않는다. 홈 승점이 전체보다 높다는 것은 홈이
  #     좋다는 뜻일 수도, 원정이 나쁘다는 뜻일 수도 있다.
  #   · 패턴은 상태 설명이지 홈 우위 점수나 승무패 추천이 아니다.
  #   · 상대 강도(SoS)는 여기서 보지 않는다 (Phase 2-F).
  venue_context:
    # 장소 경기가 이 수에 못 미치면 장소차를 만들지 않는다.
    min_sample: 3
    thresholds:
      points_gap_high: 0.40     # 경기당 승점 장소차가 이보다 크면 적는다
      attack_gap_high: 0.25     # 경기당 npxG(없으면 xG) 장소차
      defense_gap_high: 0.25    # 경기당 npxGA 장소차
      points_gap_large: 0.80    # 여러 갈래가 같은 방향일 때만 함께 본다

# 출력 ---------------------------------------------------------------------
output:
  dir: "reports"
  filename: "toto_{round}.html"

  # 폰에서 보기 --------------------------------------------------------------
  # 리포트는 외부 참조가 없는 자체 완결 HTML 이라 파일 하나만 폰으로 넘어가면
  # 그대로 열린다. 아래 폴더에 사본을 두면 클라우드 앱이 알아서 폰까지 옮긴다.
  #
  # copy_to 를 비워 두면 OneDrive / 구글드라이브 / Dropbox 를 자동으로 찾아
  # 그 안에 cloud_folder 이름의 폴더를 만든다. 직접 지정하려면 이렇게:
  #   copy_to:
  #     - "C:/Users/hsj03/OneDrive/축구토토"
  copy_to: []
  # 자동 탐색에서 빼고 싶은 폴더 (경로에 이 문구가 들어가면 건너뛴다).
  # 회사 계정 OneDrive 에 개인 파일을 쌓지 않으려고 기본으로 제외해 뒀다.
  # 개인 OneDrive 를 쓰고 싶으면 이 줄을 비우면 된다.
  copy_to_exclude: ["OneDrive"]
  cloud_folder: "축구토토"
  # 회차 파일과 별개로 항상 같은 이름의 사본을 하나 더 둔다.
  # 폰에서 즐겨찾기를 한 번만 걸어두면 늘 최신 리포트가 열린다.
  latest_name: "최신리포트.html"

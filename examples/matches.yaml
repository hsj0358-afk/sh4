# =========================================================================
# 축구토토 승무패 경기 목록 — 수동 입력 파일
#
# 베트맨 크롤링이 실패하거나(사이트 구조 변경·차단), 회차 목록을 직접
# 넣고 싶을 때 사용한다. 이 파일을 주면 크롤링을 건너뛰고 나머지 분석
# 파이프라인(배당률 · 후스코어드 · 시각화)은 완전히 동일하게 동작한다.
#
#   python -m toto --matches-file examples/matches.yaml
#
# 필드
#   league  : 리그명. config_toto.yaml 의 leagues 키 또는 한글명/별칭 아무거나.
#             (프리미어리그 / 라리가 / 분데스리가 / 세리에A / 리그앙 /
#              K리그1 / K리그2 / J리그)
#   home    : 홈팀 (베트맨 한글 표기 그대로 적으면 된다)
#   away    : 원정팀
#   kickoff : 한국시간 "YYYY-MM-DD HH:MM". 비워두면 피나클에서 채운다.
#
# 팀명이 매칭되지 않으면 리포트 상단에 경고가 뜬다. 그럴 때는
# data/teams.yaml 에 별칭 한 줄만 추가하면 다음 실행부터 해결된다.
# =========================================================================

matches:
  - {no: 1,  league: 프리미어리그, home: 맨체스터시티,     away: 번리,         kickoff: "2026-08-09 23:00"}

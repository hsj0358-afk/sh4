  - {no: 4,  league: 프리미어리그, home: 첼시,             away: 브라이튼,     kickoff: "2026-08-10 01:30"}
  - {no: 5,  league: 라리가,       home: 레알마드리드,     away: 헤타페,       kickoff: "2026-08-10 03:00"}
  - {no: 6,  league: 라리가,       home: 바르셀로나,       away: 세비야,       kickoff: "2026-08-10 05:00"}
  - {no: 7,  league: 라리가,       home: 아틀레티코마드리드, away: 발렌시아,   kickoff: "2026-08-11 03:00"}
  - {no: 8,  league: 분데스리가,   home: 바이에른뮌헨,     away: 마인츠,       kickoff: "2026-08-09 22:30"}
  - {no: 9,  league: 분데스리가,   home: 도르트문트,       away: 프라이부르크, kickoff: "2026-08-10 01:30"}
  - {no: 10, league: 세리에A,      home: 인터밀란,         away: 레체,         kickoff: "2026-08-10 02:45"}
  - {no: 11, league: 세리에A,      home: 유벤투스,         away: 토리노,       kickoff: "2026-08-11 02:45"}

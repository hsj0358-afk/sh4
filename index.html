<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#14110d" />
    <meta name="description" content="1897년, 잊힌 문명을 추적하는 모바일 텍스트 TRPG" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>잃어버린 세계의 지도</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%230d0b08' stroke='%23c8a24a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- ── 표지 ────────────────────────────────────────────── -->
      <section class="screen" id="screen-title" data-active="true">
        <div class="title-wrap">
          <div class="sun-mark" aria-hidden="true"></div>
          <p class="eyebrow">1897 · 대체역사 탐사 기록</p>
          <h1 class="game-title">잃어버린<br />세계의 지도</h1>
          <p class="subtitle">
            텍스트와 주사위로 진행되는 탐험 TRPG.<br />
            당신은 세션에 참여한 한 사람의 탐사자다.
          </p>
          <div class="title-actions">
            <button class="btn btn-primary" id="btn-new">새 탐사 시작</button>
            <button class="btn" id="btn-continue" hidden>기록 이어하기</button>
            <button class="btn btn-ghost" id="btn-archive">도감</button>
            <button class="btn btn-ghost" id="btn-about">이 게임에 대하여</button>
          </div>
          <p class="whisper">「인류는 처음이 아니었다.」</p>
        </div>
      </section>

      <!-- ── 캐릭터 생성 ─────────────────────────────────────── -->
      <section class="screen" id="screen-create">
        <header class="create-head">
          <button class="icon-btn" id="create-back" aria-label="뒤로">←</button>
          <h2>탐사자 등록</h2>
        </header>
        <div class="create-body" id="create-body">
          <label class="field">
            <span class="field-label">이름</span>
            <input
              id="input-name"
              type="text"
              maxlength="20"
              placeholder="예: 에드워드 몰리"
              autocomplete="off"
            />
          </label>

          <p class="field-label section-label">난이도</p>
          <div class="diff-list" id="diff-list"></div>

          <p class="field-label section-label">직업</p>
          <div class="prof-list" id="prof-list"></div>

          <div class="stat-preview" id="stat-preview"></div>
        </div>
        <div class="create-foot">
          <button class="btn btn-primary" id="btn-begin" disabled>계곡으로 출발</button>
        </div>
      </section>

      <!-- ── 플레이 ─────────────────────────────────────────── -->
      <section class="screen" id="screen-play">
        <header class="hud" id="hud">
          <div class="hud-line">
            <span class="hud-loc" id="hud-loc">—</span>
            <button class="icon-btn small" id="btn-menu" aria-label="메뉴">≡</button>
          </div>
          <div class="hud-line hud-sub">
            <span id="hud-date">—</span>
            <span class="dot">·</span>
            <span id="hud-time">—</span>
          </div>
          <div class="meters">
            <div class="meter" id="meter-hp">
              <span class="meter-tag">체력</span>
              <div class="bar"><i></i></div>
              <span class="meter-val">—</span>
            </div>
            <div class="meter" id="meter-san">
              <span class="meter-tag">정신</span>
              <div class="bar"><i></i></div>
              <span class="meter-val">—</span>
            </div>
            <div class="meter" id="meter-danger">
              <span class="meter-tag">위험</span>
              <div class="bar"><i></i></div>
              <span class="meter-val">—</span>
            </div>
          </div>
        </header>

        <main class="log" id="log" aria-live="polite"></main>

        <footer class="controls" id="controls">
          <div class="combat-bar" id="combat-bar" hidden>
            <div class="cb-head">
              <span class="cb-name" id="cb-name">—</span>
              <span class="cb-round" id="cb-round">—</span>
            </div>
            <div class="cb-meters">
              <div class="cb-meter" id="cb-resolve">
                <span class="cb-tag">적 전의</span>
                <div class="bar"><i></i></div>
                <span class="cb-val">—</span>
              </div>
              <div class="cb-meter" id="cb-pressure">
                <span class="cb-tag">압박</span>
                <div class="bar"><i></i></div>
                <span class="cb-val">—</span>
              </div>
            </div>
            <div class="cb-escape" id="cb-escape" hidden></div>
          </div>
          <div class="dice-bar" id="dice-bar" hidden>
            <button class="btn btn-dice" id="btn-roll">
              <span class="d20" aria-hidden="true">20</span>
              <span class="dice-text">1D20 굴리기</span>
            </button>
          </div>
          <div class="choices" id="choices"></div>
          <form class="inputbar" id="inputbar" autocomplete="off">
            <input
              id="free-input"
              type="text"
              maxlength="80"
              placeholder="직접 행동을 적는다…"
              enterkeyhint="send"
            />
            <button class="send" id="btn-send" type="submit" aria-label="행동">▲</button>
          </form>
          <nav class="tabbar">
            <button data-panel="status">상태</button>
            <button data-panel="inventory">소지품</button>
            <button data-panel="codex">기록</button>
            <button data-panel="map">지도</button>
            <button data-panel="party">동행</button>
          </nav>
        </footer>
      </section>
    </div>

    <!-- ── 하단 시트 ───────────────────────────────────────── -->
    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <h3 id="sheet-title">—</h3>
        <button class="icon-btn" id="sheet-close" aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </aside>

    <!-- ── 주사위 연출 ─────────────────────────────────────── -->
    <div class="dice-overlay" id="dice-overlay" hidden aria-hidden="true">
      <div class="dice-stage">
        <div class="die" id="die">
          <span id="die-face">20</span>
        </div>
        <p class="dice-label" id="dice-label">판정</p>
      </div>
    </div>

    <script type="module" src="./src/ui/main.js"></script>
  </body>
</html>

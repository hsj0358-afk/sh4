<title>말문 영어코치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 460px) that fills the screen height. Each view scrolls inside it;
   the talk view is a fixed three-band screen (coach line / avatar stage / controls). */
:root{
  --bg:#E8EDF3; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#162033; --ink-2:#46516A; --muted:#6F7A91; --line:#DCE2EB;
  --accent:#C8401A; --accent-ink:#FFFFFF; --accent-soft:#FCE4D8;
  --coach:#0A6E69; --coach-soft:#DAF0ED;
  --good:#16794A; --good-soft:#DDF2E5; --bad:#BC3328; --bad-soft:#FAE3E0;
  --tint-a:#FFEADF; --tint-b:#DEF3EC; --tint-c:#E2EAFA;
  --shadow:0 1px 2px rgba(22,32,51,.06),0 8px 24px rgba(22,32,51,.07);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1018; --surface:#141B27; --surface-2:#1C2533; --ink:#EAF0F8; --ink-2:#B3BDCD; --muted:#8792A6; --line:#283347;
    --accent:#FF7442; --accent-ink:#1A0B04; --accent-soft:#3A1E13;
    --coach:#5ED3C7; --coach-soft:#12302E;
    --good:#5BD68C; --good-soft:#123222; --bad:#FF8A80; --bad-soft:#3A1916;
    --tint-a:#2C1D16; --tint-b:#132A21; --tint-c:#182337;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1018; --surface:#141B27; --surface-2:#1C2533; --ink:#EAF0F8; --ink-2:#B3BDCD; --muted:#8792A6; --line:#283347;
  --accent:#FF7442; --accent-ink:#1A0B04; --accent-soft:#3A1E13;
  --coach:#5ED3C7; --coach-soft:#12302E;
  --good:#5BD68C; --good-soft:#123222; --bad:#FF8A80; --bad-soft:#3A1916;
  --tint-a:#2C1D16; --tint-b:#132A21; --tint-c:#182337;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--coach);outline-offset:2px;border-radius:8px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:460px;margin:0 auto;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:500px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:4px 32px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}

/* top bars */
.topbar{display:flex;align-items:center;gap:6px;min-height:56px}
.topbar h1{font-size:17px;font-weight:600;flex:1;text-align:center;margin-right:44px}
.grow{flex:1}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.02em}
.logo small{font-size:12px;color:var(--muted);font-weight:500;padding-top:3px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-text{color:var(--muted);min-height:44px;font-weight:500;font-size:14px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1;padding:0 12px}
.btn-col{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--coach-soft);color:var(--coach)}
.chip:disabled{opacity:.45}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.meta{font-size:13px;color:var(--muted)}
.sec-title{font-size:16px;font-weight:700}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--coach);font-size:14px;font-weight:600;min-height:36px}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* home */
.today{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface-2)}
.today .ring{flex:none;width:62px;height:62px;position:relative}
.today .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.today-big{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.today-big small{font-size:15px;color:var(--muted);font-weight:500}
.streak{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:13px}
.coach-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:20px;border:1px solid var(--line)}
.coach-card .ava-sm{width:58px;height:58px;flex:none}
.coach-card .ava-sm svg{width:100%;height:100%;display:block}
.cc-text{flex:1;min-width:0}
.cc-name{font-weight:700;font-size:16px}
.cc-name span{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.cc-tag{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-change{display:flex;align-items:center;gap:2px;color:var(--coach);font-size:13px;font-weight:600;flex:none}
.level-row{display:flex;align-items:center;gap:10px;margin-top:-6px}
.level-row .meta{flex:1;min-width:0}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.topic{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 14px 15px;border-radius:16px;background:var(--tint-a);min-height:112px}
.topic.t1{background:var(--tint-b)}
.topic.t2{background:var(--tint-c)}
.topic .t-en{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--coach);letter-spacing:.01em}
.topic .t-ko{font-weight:700;font-size:17px;line-height:1.3;margin-top:2px}
.topic .t-blurb{font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:auto;padding-top:6px}
.topic .t-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;background:var(--surface);color:var(--ink-2);padding:2px 8px;border-radius:999px}
.topic:active{transform:scale(.98)}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .ava-xs{width:40px;height:40px;flex:none}
.hist-row .ava-xs svg{width:100%;height:100%;display:block}
.hist-main{flex:1;min-width:0}
.hist-title{font-weight:600}
.hist-sub{font-size:12.5px;color:var(--muted)}
.hist-day{font-size:12px;font-weight:600;color:var(--muted);padding-top:14px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);vertical-align:2px;margin-left:4px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty b{font-size:15px}

/* coach select */
.lead{font-size:19px;font-weight:700;text-align:center;text-wrap:balance;margin-top:6px}
.coach-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.coach-pick{width:58px;height:58px;border-radius:50%;padding:3px;border:2.5px solid transparent;flex:none}
.coach-pick svg{width:100%;height:100%;display:block}
.coach-pick.sel{border-color:var(--coach)}
.coach-hero{width:min(56vw,210px);aspect-ratio:1;max-width:100%;margin:4px auto 0;position:relative}
.coach-hero svg{width:100%;height:100%;display:block}
.coach-name{text-align:center;font-size:24px;font-weight:700;line-height:1.2}
.coach-name span{display:block;font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--muted);margin-top:2px}
.coach-tags{text-align:center;color:var(--coach);font-weight:600;font-size:13.5px;margin-top:-8px}
.coach-lines{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:16px;padding:14px 16px}
.coach-lines li{position:relative;padding-left:14px;font-size:14px;color:var(--ink-2)}
.coach-lines li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--coach)}
.center{text-align:center}
.center-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.bar{padding-block:10px 14px;border-top:1px solid var(--line);background:var(--surface)}

/* talk */
.talk-top{display:flex;align-items:center;gap:4px;min-height:56px}
.tt-mid{flex:1;min-width:0;padding:0 6px}
.tt-topic{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-topic .num{color:var(--muted);font-weight:500}
.prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.prog>i{display:block;height:100%;width:0;background:var(--coach);border-radius:inherit;transition:width .45s}
.tt-time{color:var(--muted);font-size:13px;min-width:42px;text-align:right}
.coach-line{flex:none;max-height:40%;overflow-y:auto;padding:12px 2px 6px;display:flex;flex-direction:column;gap:6px}
.cl-tag{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.cl-pre{font-family:var(--f-display);font-size:16.5px;font-weight:500;color:var(--ink-2);line-height:1.4}
.cl-en{font-family:var(--f-display);font-weight:650;font-size:clamp(21px,5.8vw,25px);line-height:1.28;color:var(--coach);letter-spacing:-.012em;text-wrap:pretty}
.cl-en .fix{color:var(--good)}
.cl-ko{font-size:14.5px;color:var(--ink-2)}
.cl-tip{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:9px 12px}
.cl-tip span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.cl-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stage{flex:1;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 0;overflow-y:auto}
.ava-wrap{width:min(42vw,176px,26vh);aspect-ratio:1;max-width:100%;position:relative;flex:none}
.ava-wrap svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.ava-wrap::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--coach);opacity:0}
.ava-wrap.speaking::before{animation:halo 1.5s ease-out infinite}
@keyframes halo{0%{opacity:.55;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.stage-cap{font-size:13px;color:var(--muted);text-align:center;min-height:1.5em}
.bubble{max-width:94%;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:18px;font-size:15.5px;line-height:1.45;text-align:center;overflow-wrap:anywhere}
.bubble.live{opacity:.85}
.bubble .ph{opacity:.6}
.bubble .d-del{color:inherit;opacity:.75}
.rcard{width:100%;background:var(--surface-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rcard .rc-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.rcard .rc-text{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.4}
.rcard .rc-title{font-weight:700}
.rcard .rc-title.good{color:var(--good)}
.rcard .rc-sub{font-size:13px;color:var(--ink-2)}
.controls{flex:none;padding-block:8px 14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.ctl-row{display:flex;align-items:center;justify-content:center;gap:26px}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;font-size:12px;color:var(--ink-2)}
.side .c{width:46px;height:46px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.side:disabled{opacity:.4}
.orb{width:78px;height:78px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;flex:none;
  box-shadow:0 10px 26px -6px color-mix(in srgb,var(--accent) 55%,transparent)}
.orb svg{position:relative;z-index:1}
.orb.listening{background:var(--coach);color:var(--surface);box-shadow:0 10px 26px -6px color-mix(in srgb,var(--coach) 55%,transparent)}
.orb.listening::before,.orb.listening::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--coach);opacity:.35;animation:pulse 1.6s ease-out infinite}
.orb.listening::after{animation-delay:.8s}
@keyframes pulse{from{transform:scale(1);opacity:.35}to{transform:scale(1.65);opacity:0}}
.orb:disabled{opacity:.55;box-shadow:none}
.orb .spin{width:28px;height:28px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb-label{text-align:center;font-size:13px;color:var(--muted);margin-top:-2px}
.typebar{display:flex;align-items:flex-end;gap:8px}
.typebar textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:20px;padding:11px 15px;font:inherit;font-size:16px;line-height:1.4;max-height:132px}
.typebar textarea:focus{outline:none;border-color:var(--coach)}
.round{border-radius:50%;background:var(--surface-2);width:46px;height:46px}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sendbtn:disabled{opacity:.5}
.tip-line{font-size:12.5px;color:var(--muted);text-align:center}

/* diff marks */
.d-del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.d-ins{background:var(--good-soft);color:var(--good);border-radius:5px;padding:0 3px;font-weight:700}

/* report */
.rep-head{display:flex;flex-direction:column;gap:8px}
.rep-title{font-size:24px;font-weight:700;line-height:1.25;text-wrap:balance}
.rep-coach{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.rep-coach .ava-xs{width:30px;height:30px}
.rep-coach .ava-xs svg{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:13.5px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;font-weight:700}
.card .body{color:var(--ink-2);font-size:14.5px}
.bul{display:flex;flex-direction:column;gap:5px}
.bul li{position:relative;padding-left:14px;font-size:14px;color:var(--ink-2)}
.bul li::before{content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--coach)}
.bul.focus li::before{background:var(--accent)}
.skel{height:12px;border-radius:6px;background:var(--surface-2);animation:shimmer 1.4s ease-in-out infinite}
.skel.s2{width:82%}.skel.s3{width:64%}
@keyframes shimmer{50%{opacity:.5}}
.fb{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.fb-no{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fb-q{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.fb-lbl{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);align-self:flex-start}
.fb-lbl.good{background:var(--good-soft);color:var(--good)}
.fb-said{font-size:15px;color:var(--ink-2)}
.fb-fix{display:flex;align-items:flex-start;gap:8px}
.fb-fix p{flex:1;min-width:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.4}
.fb-tip{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px}
.fb-tip span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fb-rep{font-size:12.5px;color:var(--muted)}
.play{width:36px;height:36px;border-radius:50%;background:var(--coach-soft);color:var(--coach);display:grid;place-items:center;flex:none}
.good-list li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.good-list li:last-child{border-bottom:0}
.good-list p{flex:1;min-width:0;font-family:var(--f-display);font-size:15.5px;font-weight:500}
.good-list small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.expr li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.expr li:last-child{border-bottom:0}
.expr p{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.35}
.expr small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-2);margin-top:1px}
details.transcript{border:1px solid var(--line);border-radius:18px;padding:4px 16px}
details.transcript summary{cursor:pointer;min-height:46px;display:flex;align-items:center;font-weight:600;font-size:14px}
.tr{display:flex;flex-direction:column;gap:8px;padding-bottom:14px}
.tr p{font-size:14px}
.tr .tr-c{color:var(--coach);font-family:var(--f-display)}
.tr .tr-u{color:var(--ink);padding-left:12px;border-left:2px solid var(--line)}

/* sheet */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:6px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.sheet-head h2{font-size:17px;font-weight:700}
.grp{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.grp>h3{font-size:13px;font-weight:700;color:var(--muted)}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line)}
.opt.sel{border-color:var(--coach);background:var(--coach-soft)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.sel .dot{border-color:var(--coach)}
.opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--coach)}
.opt b{display:block;font-size:15px}
.opt span{font-size:12.5px;color:var(--ink-2)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button.sel{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;text-align:left;font-size:15px}
.tog i{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-checked="true"] i{background:var(--coach)}
.tog[aria-checked="true"] i::after{transform:translateX(18px)}
.env li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
.env li span:first-child{color:var(--muted);flex:none}
.env li span:last-child{text-align:right}
.ok-dot,.off-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ok-dot{background:var(--good)}.off-dot{background:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(420px,calc(100% - 32px));
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease-out}

/* resume · review · records */
.resume{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--accent-soft)}
.resume .btn-row .btn{min-height:44px;font-size:15px}
.review-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--coach)}
.review-card .rv-n{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--coach);line-height:1;min-width:40px;text-align:center}
.review-card .rv-text{flex:1;min-width:0}
.review-card .rv-text b{display:block;font-size:15px}
.review-card.quiet{border-color:var(--line)}
.review-card.quiet .rv-n{color:var(--muted)}
.records{display:flex;flex-direction:column;gap:10px}
.rec-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.rec-row span:first-child{color:var(--muted)}
.rec-row span:last-child{text-align:right;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag b{color:var(--accent);font-variant-numeric:tabular-nums}
.suggest{background:var(--coach-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.suggest b{font-size:15px}
.stats.s4{grid-template-columns:repeat(2,minmax(0,1fr))}
.rv-cue{border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.rv-cue .rv-lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.rv-cue .rv-q{font-family:var(--f-display);font-size:22px;font-weight:650;line-height:1.32;overflow-wrap:anywhere}
.rv-cue .rv-q.ko{font-family:var(--f-body);font-size:19px;font-weight:600}
.rv-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:8px}
/* onboarding */
.ob-steps{display:flex;gap:6px}
.ob-steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.ob-steps i.on{background:var(--coach)}
.ob-title{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance}
.how{display:flex;flex-direction:column;gap:9px;background:var(--surface-2);border-radius:16px;padding:14px 16px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.how li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--coach);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.ob-coach{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1.5px solid var(--coach)}
.ob-coach .ava-sm{width:64px;height:64px;flex:none}
.ob-coach .ava-sm svg{width:100%;height:100%;display:block}
.ob-coach p{font-size:13px;color:var(--ink-2)}
.ob-coach b{display:block;font-size:17px}

/* avatar animation */
.ava .ava-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.ava .m-open{transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
.speaking .ava .m-open{animation:talk .26s ease-in-out infinite alternate}
.speaking .ava .m-closed{opacity:0}
.speaking .ava .ava-head{transform-box:fill-box;transform-origin:50% 80%;animation:bob 1.3s ease-in-out infinite}
@keyframes talk{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.5px) rotate(-1.2deg)}}
@media (prefers-reduced-motion: reduce){
  .ava .ava-eyes,.speaking .ava .ava-head,.ava-wrap.speaking::before,.orb.listening::before,.orb.listening::after,.skel{animation:none}

const tokens = s => String(s || '').trim().split(/\s+/).filter(Boolean);
const nk = w => w.toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9']/g, '');
const hasLatin = s => /[a-z]/i.test(s || '');
function lcsTable(A, B) {
  const n = A.length, m = B.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = (A[i] && A[i] === B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  return dp;
}
function diffWords(aText, bText) {
  const a = tokens(aText), b = tokens(bText), A = a.map(nk), B = b.map(nk), dp = lcsTable(A, B), ops = [];
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (A[i] && A[i] === B[j]) { ops.push({ t: 'eq', a: a[i], b: b[j] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push({ t: 'del', a: a[i++] });
    else ops.push({ t: 'ins', b: b[j++] });
  }
  while (i < a.length) ops.push({ t: 'del', a: a[i++] });
  while (j < b.length) ops.push({ t: 'ins', b: b[j++] });
  return ops;
}
// side 'a' = original with removed words struck; side 'b' = corrected with new words marked
function diffView(aText, bText, side) {
  const frag = document.createDocumentFragment();
  if (!hasLatin(aText) || !hasLatin(bText)) { frag.append(side === 'a' ? aText : bText); return frag; }
  let first = true;
  for (const o of diffWords(aText, bText)) {
    if ((side === 'a' && o.t === 'ins') || (side === 'b' && o.t === 'del')) continue;
    if (!first) frag.append(' ');
    first = false;
    const w = side === 'a' ? o.a : o.b;
    frag.append(o.t === 'eq' ? document.createTextNode(w) : h('span', { class: o.t === 'del' ? 'd-del' : 'd-ins' }, w));
  }

}
function similarity(x, y) {
  const A = tokens(x).map(nk).filter(Boolean), B = tokens(y).map(nk).filter(Boolean);
  if (!A.length || !B.length) return 0;
  return (2 * lcsTable(A, B)[0][0]) / (A.length + B.length);
}

/* ───────────────────────── storage ─────────────────────────

const Store = {
  mode:'local', db:null, profRef:null, revRef:null, profQ:Promise.resolve(), revQ:Promise.resolve(), sessQ:new Map(), timer:null, revTimer:null,
  loadLocal() {
    try { const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return o && typeof o === 'object' ? o : {}; }
    catch (e) { this.mode = 'none'; return {}; }
  },
  loadReview() {
    try { const a = JSON.parse(localStorage.getItem(REVIEW_KEY) || '[]'); return Array.isArray(a) ? a.filter(validItem) : []; }
    catch (e) { return []; }
  },
  writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ profile:S.profile, sessions:S.sessions.slice(0, 80) })); }
    catch (e) { if (this.mode === 'local') { this.mode = 'none'; toast('이 화면에서는 기록을 저장할 수 없어요. 수업은 계속할 수 있어요.'); if (S.view === 'home') render(); } }
  },
  async connect(db, user) {
    let uid = null;

      const snap = await timeout(profRef.collection('sessions').orderBy('startedAt', 'desc').limit(80).get(), 9000);
      mergeSessions(snap.docs.map(d => d.data()).filter(validSession));

/* ───────────────────────── review deck ─────────────────────────
   Corrected sentences and key expressions come back after 1, 3, 7, 14 and 30 days.
   A miss sends the sentence back to tomorrow. */

const REVIEW_CAP = 250, INTERVALS = [1, 3, 7, 14, 30], DAY = 86400000;

const validItem = i => i && typeof i === 'object' && typeof i.id === 'string' && typeof i.target === 'string' && i.target
  && typeof i.cue === 'string' && typeof i.due === 'number' && typeof i.box === 'number';
function mergeReview(list) {
  if (!Array.isArray(list)) return;
  const byId = new Map(S.review.map(i => [i.id, i]));
  for (const it of list.filter(validItem)) {
    const mine = byId.get(it.id);
    if (!mine || (it.u || 0) > (mine.u || 0)) byId.set(it.id, it);
  }
  S.review = [...byId.values()];
}
function addReviewItems(items) {
  const known = new Set(S.review.map(i => reviewKey(i.target)));
  let added = 0;
  for (const it of items) {
    const k = reviewKey(it.target);
    if (!k || known.has(k)) continue;
    known.add(k); S.review.push(it); added++;

  if (trimReview() || added) Store.saveReview();

}

// The best-learned, oldest cards go first.
const REVIEW_BYTES = 200000;
const jsonBytes = v => new TextEncoder().encode(JSON.stringify(v)).length;

  let bytes = jsonBytes(S.review);
  if (S.review.length <= REVIEW_CAP && bytes <= REVIEW_BYTES) return false;
  S.review.sort((a, b) => (b.box - a.box) || (a.added - b.added));
  let drop = 0;
  while (S.review.length - drop > REVIEW_CAP || (bytes > REVIEW_BYTES && S.review.length - drop > 1)) bytes -= jsonBytes(S.review[drop++]) + 1;
  S.review = S.review.slice(drop);

}
function newItem(sessId, n, kind, cue, target, ko, tip, topicId) {
  const now = Date.now();

    due:startOfDay(now) + DAY, seen:0, right:0, added:now, u:now };
}
const dueItems = (now = Date.now()) => S.review.filter(i => i.due <= now).sort((a, b) => (a.due - b.due) || (a.box - b.box));

${items}

{"summary_ko": "2-3 sentences of overall feedback", "strengths_ko": ["one or two specific things they did well"], "focus_ko": ["one or two specific things to practice next"], "expressions": [{"en": "a useful English sentence or phrase from this lesson, usually a corrected one", "ko": "its meaning in Korean"}]}

}
async function summaryRun(sess) {

  sess.summaryState = 'pending';
  if (S.view === 'report' && S.reportId === sess.id) render();

    const r = await sample.json(summaryPrompt(sess), { modelTier:'default' });

      expressions:(Array.isArray(r.expressions) ? r.expressions : []).map(x => ({ en:str(x && x.en), ko:str(x && x.ko) })).filter(x => x.en).slice(0, 6) };
    sess.summaryState = 'ok';
    addReviewItems(sess.summary.expressions.filter(x => x.ko).map((x, j) => newItem(sess.id, 'x' + j, 'expr', x.ko, x.en, x.ko, '', sess.topicId)));

function aiErrorText(code) {

  if (code === 'session_expired') return 'Claude에 다시 로그인한 뒤 시도해 주세요.';
  if (code === 'refused') return '이 대답으로는 응답을 만들지 못했어요. 다르게 말해 보거나 건너뛰어 주세요.';
  if (code === 'prompt_too_large') return '대화가 너무 길어졌어요. 수업을 마치고 리포트를 확인해 주세요.';

/* ───────────────────────── lesson flow ───────────────────────── */

function questionBank(tp) {
  if (tp.qs) return tp.ordered ? tp.qs.slice() : shuffle(tp.qs);
  const pool = TOPICS.filter(t => ['intro', 'hobby', 'travel', 'food', 'daily', 'movies'].includes(t.id)).flatMap(t => t.qs);
  return shuffle(pool).slice(0, 12);
}
const SELF_LINE = ['Almost! Can you fix one part and say it again?', '거의 맞았어요! 한 군데만 고쳐서 다시 말해 볼까요?'];
const SELF_OK = ["That's it! You fixed it yourself.", '바로 그거예요! 스스로 고쳤어요.'];
const bankQ = (q, pre_en, pre_ko) => ({ kind:'question', pre_en, pre_ko, q_en:q[0], q_ko:q[1], hint:q[2], hintLabel:'예시 답변', model:q[2] });
const lineEn = cur => !cur ? '' : cur.kind === 'correction'
  ? (cur.revealed === false ? SELF_LINE[0] : `You should say, "${cur.corrected}"`)
  : [cur.pre_en, cur.q_en].filter(Boolean).join(' ');

function startClock() {
  clearInterval(clock);
  clock = setInterval(() => { if (T && R && R.time) R.time.textContent = fmtClock(elapsed()); }, 1000);
}
function startLesson(topicId, coachId, force) {
  if (!force && S.resume && !S.resume.turns.length) clearLessonDraft();
  if (!force && S.resume) {                 // never overwrite a paused lesson with answers without asking
    const o = S.resume, tp0 = topicById(o.topicId);
    openSheet('멈춘 수업이 있어요', () => [
      h('p', { class:'meta' }, `${tp0.ko} 수업에서 ${o.turns.length}번 대답하고 멈췄어요. 새 수업을 시작하면 멈춘 수업은 ${o.turns.length ? '지금까지의 대답으로 리포트를 만들고 끝내요' : '사라져요'}.`),
      h('div', { class:'btn-col' },
        h('button', { class:'btn btn-primary btn-block', onclick:() => { closeSheet(); resumeLesson(); } }, '멈춘 수업 이어 하기'),
        h('button', { class:'btn btn-ghost btn-block', onclick:() => { closeSheet(); endPaused(true); startLesson(topicId, coachId, true); } }, '새 수업 시작하기')),
    ]);
    return;
  }
  const tp = topicById(topicId), c = coachById(coachId || S.profile.coachId), L = levelById(S.profile.level);
  const bank = questionBank(tp);
  const mode = S.aiState === 'off' ? 'practice' : 'ai';
  const pre_en = c.greet[0] + ' ' + (tp.intro ? tp.intro[0] : c.greet[2].replace('{t}', tp.about));
  const pre_ko = c.greet[1] + ' ' + (tp.intro ? tp.intro[1] : c.greet[3].replace('{t}', tp.aboutKo));
  T = { id:newId(), topicId:tp.id, coachId:c.id, level:L.id, mode, startedAt:Date.now(), activeMs:0, resumedAt:Date.now(),
    target: mode === 'practice' ? Math.min(S.profile.lessonLen, bank.length) : S.profile.lessonLen,
    bank, bankPos:1, turns:[], cur:bankQ(bank[0], pre_en, pre_ko), next:null,
    phase:'await', showKo:S.profile.showKo, showHint:false, input:Mic.ok ? 'voice' : 'text', inputAuto:true,
    ansLang:'en', draft:'', repeatDraft:'', repeat:null, selfMiss:null, error:null, failed:null, pending:null, notice:'', ctl:null };
  S.resume = null;
  S.view = 'talk';
  render();
  Voice.speak(lineEn(T.cur), c, L.id);            // inside the tap, so browser voices are allowed to start
  startClock();
}
// A lesson saved in this browser (after a reload or an app switch) comes back where it stopped.
function restoreLesson(o) {
  const t = { ...o, activeMs:o.activeMs || 0, resumedAt:Date.now(), input:Mic.ok ? 'voice' : 'text', inputAuto:true, showHint:false,
    repeatDraft:'', error:null, failed:null, pending:null, notice:'', ctl:null };
  delete t.v; delete t.savedAt;
  if (t.draft) { t.input = 'text'; t.inputAuto = false; }   // a half-written answer must stay visible
  return t;
}
function resumeLesson() {
  const o = S.resume || loadLessonDraft();
  if (!o) return;
  T = restoreLesson(o);
  S.resume = null;
  if (T.mode === 'ai' && S.aiState === 'off') toPractice(true);
  S.view = 'talk';
  render();
  if (T.phase !== 'done') Voice.speak(lineEn(T.cur));
  startClock();
}
// Close a paused lesson without opening it: answers become a report, an empty one is dropped.
function endPaused(silent) {
  const o = S.resume;
  if (!o) return;
  if (!o.turns.length) { clearLessonDraft(); if (!silent) render(); return; }
  T = restoreLesson(o);
  finishLesson(silent);
}

function newTurn(answer, via) {
  return { q_en:T.cur.q_en, q_ko:T.cur.q_ko || '', answer, via:via === 'voice' ? 'voice' : 'text', correction:null, reaction_en:'', reaction_ko:'', repeat:null, selfFix:null,
    model:T.cur.model || null, hint:T.cur.model ? null : (T.cur.hint || null) };
}
async function submitAnswer(text, via) {
  if (!T) return;
  text = String(text || '').trim();
  if (!text || !['await', 'listening', 'error'].includes(T.phase)) return;
  Voice.stop();
  const turn = newTurn(text, via);
  T.draft = ''; T.showHint = false; T.error = null; T.notice = '';
  const isLast = T.turns.length + 1 >= T.target;
  if (T.mode === 'practice') { practiceAnswer(turn, isLast); return; }
  T.phase = 'thinking'; T.pending = turn;
  paintTalk();
  const lesson = T;
  try {
    const r = await askTurn(turn, isLast, false);
    if (T !== lesson) return;
    applyTurn(turn, r, isLast);
  } catch (e) {
    if (T !== lesson || e?.code === 'cancelled') return;
    T.pending = null;
    if (PERMANENT.includes(e?.code)) { S.aiState = 'off'; toPractice(true); practiceAnswer(turn, isLast); return; }

// Self-repair first (prompt, then the answer if needed) for learners past the starter level.

  turn.correction = r.correction; turn.reaction_en = r.reaction_en; turn.reaction_ko = r.reaction_ko;
  T.turns.push(turn); T.pending = null;
  T.next = { kind:isLast ? 'closing' : 'question', pre_en:r.reaction_en, pre_ko:r.reaction_ko, q_en:r.question_en, q_ko:r.question_ko,
    hint:r.hint_en, hintLabel:'이렇게 시작해 보세요', model:null };
  if (turn.correction) {
    const c = turn.correction, self = wantsSelfFix(turn, c);
    T.asked = T.cur;
    T.cur = { kind:'correction', corrected:c.corrected, corrected_ko:c.corrected_ko || '', tip_en:c.tip_en, tip_ko:c.tip_ko,
      hint_ko:c.hint_ko || '', category:c.category || '', original:turn.answer, q_en:turn.q_en, revealed:!self };
    T.phase = self ? 'selffix' : 'correction'; T.repeat = null; T.repeatDraft = ''; T.selfMiss = null;
    paintTalk();
    Voice.speak(lineEn(T.cur));

}
function advance() {
  if (!T || !T.next) return;
  Mic.cancel();
  T.cur = T.next; T.next = null; T.repeat = null; T.repeatDraft = ''; T.selfMiss = null; T.asked = null;
  T.phase = T.cur.kind === 'closing' ? 'done' : 'await';

}
function toPractice(announce) {

  if (announce) T.notice = '이 화면에서는 AI 교정을 쓸 수 없어 연습 모드로 이어 가요. 모범 답안과 비교해 보세요.';
}
function practiceAnswer(turn, isLast) {

}
function practiceNext() {
  if (!T || T.phase !== 'model') return;

  if (T.turns.length >= T.target || T.bankPos >= T.bank.length) {
    T.cur = { kind:'closing', pre_en:pre[0], pre_ko:pre[1], q_en:"That's the end of today's practice. Let's look at your answers together.", q_ko:'오늘 연습은 여기까지예요. 내 대답을 함께 확인해 봐요.' };

  if (turn) { T.turns.push(turn); }
  const isLast = T.turns.length >= T.target;
  if (isLast || T.bankPos >= T.bank.length) {
    T.cur = { kind:'closing', pre_en:'Okay!', pre_ko:'좋아요!', q_en:"That's all for today. Your report is ready.", q_ko:'오늘은 여기까지예요. 리포트를 확인해 보세요.' };

async function askEasier() {
  if (!T || T.phase !== 'await' || T.mode !== 'ai') return;
  Voice.stop(); T.phase = 'thinking'; T.showHint = false; paintTalk();
  const lesson = T;
  try {
    const r = await askTurn(null, false, true);
    if (T !== lesson) return;
    T.cur = { kind:'question', pre_en:r.reaction_en, pre_ko:r.reaction_ko, q_en:r.question_en, q_ko:r.question_ko,
      hint:r.hint_en || T.cur.hint, hintLabel:'이렇게 시작해 보세요', model:T.cur.model };
    T.phase = 'await'; paintTalk(); Voice.speak(lineEn(T.cur));
  } catch (e) {
    if (T !== lesson || e?.code === 'cancelled') return;
    if (PERMANENT.includes(e?.code)) { S.aiState = 'off'; toPractice(true); }

const scoreOf = (text, target) => Math.round(similarity(text, target) * 100) / 100;
function checkRepeat(text) {

  text = String(text || '').trim();
  if (!text) return;
  const score = scoreOf(text, T.cur.corrected);

}
function checkSelfFix(text) {

  text = String(text || '').trim();
  if (!text) return;
  const score = scoreOf(text, T.cur.corrected), ok = score >= 0.85;
  const last = T.turns[T.turns.length - 1];

/* mic orb */
function onOrb() {

  const P = T.phase;
  if (P === 'await') { Mic.start('answer'); T.phase = 'listening'; T.showHint = false; paintTalk(); }
  else if (P === 'selffix') { Mic.start('self'); T.phase = 'self-listen'; paintTalk(); }
  else if (P === 'correction' || P === 'repeat-result') { Mic.start('repeat'); T.phase = 'repeat-listen'; T.repeat = null; paintTalk(); }

  else if (P === 'repeat-listen') finishListening('repeat');

  const lesson = T;
  const text = await Mic.finish();
  if (T !== lesson) return;
  if (!text) {
    T.phase = kind === 'answer' ? 'await' : kind === 'self' ? 'selffix' : 'correction';
    paintTalk();

/* ending */
function stopLessonIO() {

}

  const items = [];

    const c = t.correction;
    if (!c || !c.corrected) return;
    if (hasLatin(t.answer)) items.push(newItem(sess.id, i, 'fix', t.answer, c.corrected, c.corrected_ko, c.tip_ko || c.tip_en, sess.topicId));
    else items.push(newItem(sess.id, i, 'expr', c.corrected_ko || t.answer, c.corrected, c.corrected_ko || t.answer, c.tip_ko || c.tip_en, sess.topicId));
  });

}
function finishLesson(silent) {
  if (!T) return;
  stopLessonIO();
  if (T.pending) { T.turns.push(T.pending); T.pending = null; }          // an answer still being checked is kept as said
  if (T.failed) { T.turns.push(T.failed); T.failed = null; }
  const end = Date.now();
  const sess = { id:T.id, v:1, topicId:T.topicId, coachId:T.coachId, level:T.level, mode:T.mode,
    startedAt:T.startedAt, endedAt:end, durationSec:Math.round(elapsed() / 1000),
    turns:T.turns.map(t => ({ q_en:t.q_en, q_ko:t.q_ko, answer:t.answer, correction:t.correction, reaction_en:t.reaction_en,
      reaction_ko:t.reaction_ko, repeat:t.repeat, selfFix:t.selfFix || null, model:t.model })),
    summary:null, summaryState:(T.mode === 'ai' && T.turns.length) ? 'pending' : 'none' };
  T = null; R = null;
  clearLessonDraft();
  Store.saveSession(sess);
  addReviewItems(lessonReviewItems(sess));

  if (sess.summaryState === 'pending') requestSummary(sess);
}

    h('p', { class:'meta' }, `지금까지 ${n}번 대답했어요. 여기서 끝내도 지금까지의 리포트를 볼 수 있어요.`
      + (T && T.phase === 'thinking' ? ' 코치가 살펴보던 마지막 대답은 교정 없이 기록돼요.' : '')),
    h('div', { class:'btn-col' },
      h('button', { class:'btn btn-primary btn-block', onclick:() => { closeSheet(); finishLesson(); } }, '끝내고 리포트 보기'),
      h('button', { class:'btn btn-ghost btn-block', onclick:closeSheet }, '계속하기'),
      h('button', { class:'btn btn-text btn-block', onclick:() => { closeSheet(); exitLesson(); } }, '기록하지 않고 나가기')),

function categoryCounts(sessions) {
  const n = {};
  for (const s of sessions) for (const t of s.turns) {
    const c = t.correction && t.correction.category;
    if (c && c !== 'other' && CATEGORIES[c]) n[c] = (n[c] || 0) + 1;
  }
  return Object.entries(n).sort((a, b) => b[1] - a[1]);
}

function paintBubble() {
  if (!R || !T) return;
  const B = R.bubble, P = T.phase;
  B.replaceChildren(); B.classList.remove('live');
  let show = true;
  if (P === 'listening' || P === 'repeat-listen' || P === 'self-listen') {
    const t = Mic.text();
    B.classList.add('live');
    B.append(t ? t : h('span', { class:'ph' }, P === 'listening' ? '말하는 내용이 여기에 보여요' : P === 'self-listen' ? '고쳐 말한 내용이 여기에 보여요' : '따라 말한 내용이 여기에 보여요'));
  } else if (P === 'thinking' && T.pending) B.append(T.pending.answer);
  else if (P === 'error' && T.failed) B.append(T.failed.answer);
  else if (P === 'selffix' && T.cur.kind === 'correction') B.append(T.cur.original);
  else if (P === 'correction' && T.cur.kind === 'correction') B.append(diffView(T.cur.original, T.cur.corrected, 'a'));
  else if (P === 'repeat-result' && T.repeat) B.append(T.repeat.text);
  else if (P === 'model') B.append(T.turns[T.turns.length - 1]?.answer || '');

  B.hidden = !show;
  R.mis.hidden = !(show && canMisheard());
}

  const pw = prev.reduce((n, s) => n + sessionNumbers(s).words, 0), pa = prev.reduce((n, s) => n + s.turns.length, 0);

    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }

  const d = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 }[e.key];
  const r = d && e.target.closest && e.target.closest('[role="radio"]');
  const g = r && r.closest('[role="radiogroup"]');
  if (!g) return;
  e.preventDefault();
  const list = [...g.querySelectorAll('[role="radio"]')];
  const i = (list.indexOf(r) + d + list.length) % list.length;
  const key = g.id ? '#' + g.id : g.getAttribute('aria-label') ? `[role="radiogroup"][aria-label="${g.getAttribute('aria-label')}"]` : null;

    const tog = (id, label, on, set) => h('button', { class:'tog', id, role:'switch', 'aria-checked':String(on), onclick:() => set(!on) }, label, h('i'));
    const ai = S.aiState === 'ready' ? [true, 'Claude 연결 · 첫 대답 때 허락을 물어봐요'] : S.aiState === 'off' ? [false, '쓸 수 없어요 · 연습 모드'] : [false, '확인 중'];
    const vo = Voice.blocked ? [false, '꺼져 있어요 · 아티팩트 권한 메뉴에서 켤 수 있어요'] : Voice.mode === 'claude' ? [true, 'Claude 목소리'] : Voice.mode === 'browser' ? [true, '브라우저 목소리'] : [false, '없음 · 자막으로 진행'];
    const mi = Mic.ok ? [true, '말로 대답 가능 · 처음 누를 때 허락을 물어봐요'] : [false, '키보드로 대답'];
    const st = Store.mode === 'db' ? [true, '내 Claude 계정 · 다른 기기에서도 보여요'] : Store.mode === 'local' ? [true, '이 브라우저에만 저장돼요'] : [false, '저장할 수 없어 기록이 남지 않아요'];
    const row = (k, [ok, v]) => h('li', {}, h('span', {}, k), h('span', {}, h('i', { class:ok ? 'ok-dot' : 'off-dot' }), v));
    return [
      h('div', { class:'grp', role:'radiogroup', 'aria-label':'내 레벨' }, h('h3', {}, '내 레벨'), LEVELS.map(L =>
        h('button', { class:'opt' + (P.level === L.id ? ' sel' : ''), role:'radio', 'aria-checked':String(P.level === L.id), onclick:() => setProfile({ level:L.id }) },
          h('span', { class:'dot' }), h('span', {}, h('b', {}, `${L.ko} · ${L.en}`), h('span', {}, L.desc))))),
      h('div', { class:'grp' }, h('h3', {}, '한 수업의 질문 수'), seg('lessonLen', [5, 8, 12], P.lessonLen, v => `${v}문답`, v => setProfile({ lessonLen:v }))),
      h('div', { class:'grp' }, h('h3', {}, '하루 목표'), seg('goalMin', [10, 15, 20, 30], P.goalMin, v => `${v}분`, v => setProfile({ goalMin:v }))),
      h('div', { class:'grp' }, h('h3', {}, '보기와 소리'),
        tog('showKo', '한국어 해석 기본으로 보기', P.showKo, v => setProfile({ showKo:v })),
        tog('selfFix', '틀린 문장은 먼저 스스로 고쳐 보기', P.selfFix, v => setProfile({ selfFix:v })),
        h('p', { class:'meta' }, '초급 이상에서 교정 문장을 바로 보여 주지 않고 힌트를 먼저 보여 줘요. 스스로 고쳐 말해 보는 연습이 오래 기억에 남아요.'),
        Voice.usable() ? tog('voiceOn', '코치 목소리', P.voiceOn, v => { setProfile({ voiceOn:v }); if (!v) Voice.stop(); }) : null),
      h('div', { class:'grp' }, h('h3', {}, '지금 이 화면에서'),
        h('ul', { class:'env' }, row('AI 대화·교정', ai), row('코치 목소리', vo), row('대답 방법', mi), row('학습 기록', st)),
        Mic.ok ? null : h('p', { class:'note' }, MOBILE_VOICE_TIP + ' PC의 Chrome·Edge 브라우저나 Claude 데스크톱 앱에서는 앱 안에서 바로 말로 대답할 수 있어요.'),
        h('p', { class:'meta' }, 'AI 대화와 교정, 코치 목소리는 지금 보고 있는 사람의 Claude 사용량을 써요.')),
      h('div', { class:'grp' }, h('button', { class:'link', onclick:() => { closeSheet(); S.ob = null; go('onboard'); } }, '처음 안내 다시 보기')),
    ];
  });
}

/* ───────────────────────── boot ───────────────────────── */

(function boot() {
  const local = Store.loadLocal();
  S.profile = { ...DEFAULT_PROFILE, ...sanitizeProfile(local.profile) };
  S.sessions = (Array.isArray(local.sessions) ? local.sessions : []).filter(validSession)
    .map(s => (s.summaryState === 'pending' ? { ...s, summaryState:'failed' } : s))
    .sort((a, b) => b.startedAt - a.startedAt);
  S.review = Store.loadReview();
  S.resume = loadLessonDraft();
  // Learners who used the app before onboarding existed are not sent through it.
  if (!S.profile.onboarded && (S.sessions.length || (local.profile && typeof local.profile === 'object' && typeof local.profile.onboarded !== 'boolean'))) S.profile.onboarded = true;
  if (!S.profile.onboarded) S.view = 'onboard';
  render();
  initCaps();
})();
</script>
